name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pymupdf python-dotenv

      # The deterministic parsing layer exists twice — Python for the local
      # pipeline, TypeScript for the browser. These run the same shared fixture
      # through both, so a change to one that is not mirrored in the other
      # fails here rather than drifting silently.
      - name: Parity (Python side)
        run: python3 tests/test_parity.py
        working-directory: tools/pipeline
      - name: Python unit tests
        run: |
          python3 tests/test_normalize.py
          python3 tests/test_matching.py
        working-directory: tools/pipeline

      - name: TypeScript tests
        run: npm test

      # The privacy guard is the only enforcement of the rule that lab reports
      # never leave the machine, so it needs to work on a machine that is not
      # the author's.
      - name: Hook tests
        run: npm run test:hooks

      # The docs are checked, not merely written: constants that appear in both
      # a doc and the code must agree, every internal link must resolve, and the
      # CLAUDE.md files must stay inside their budget.
      - name: Docs
        run: npm run docs:check

      # Covers the web app, the Worker, and — since the tools project was added
      # — bench/, e2e/ and tests/live/, which reach across directories by
      # relative path and were previously checked by nothing at all.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The published demo must never contain real patient data. The generator
      # is synthetic, so regenerating it must produce no diff — if it does,
      # something else wrote into apps/bloodwork/public/demo.
      - name: Demo data is reproducible and synthetic
        run: |
          cd tools/pipeline
          python3 -m scripts.seed_registry
          python3 -m scripts.make_demo_data
          cd ../..
          git diff --exit-code -- apps/bloodwork/public/demo/reports.json apps/bloodwork/public/demo/registry.json
